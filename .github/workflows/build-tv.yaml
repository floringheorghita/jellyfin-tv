name: Build Jellyfin TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Signing key lives in the repo's Actions secrets, never in the code
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 or KEYSTORE_PASSWORD secret is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          KS="$RUNNER_TEMP/jellyfin-tv.jks"
          # Tolerate stray spaces/newlines picked up when pasting the secrets
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS" || {
            echo "::error::KEYSTORE_BASE64 is not valid base64 - re-copy the whole value"; exit 1; }
          PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          echo "::add-mask::$PW"
          echo "::notice::keystore $(wc -c < "$KS") bytes, sha256 $(sha256sum "$KS" | cut -c1-16); password length ${#PW}"
          if ! keytool -list -keystore "$KS" -storepass "$PW" >/dev/null 2>&1; then
            echo "::error::Keystore won't open with KEYSTORE_PASSWORD - check both secrets were pasted exactly"
            exit 1
          fi
          echo "TV_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      # libre flavour: no Google Play services, which Fire TV doesn't have
      - name: Build APK
        env:
          JELLYFIN_VERSION: 1.0.${{ github.run_number }}
          JELLYFIN_TV_BUILD: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/jellyfin-tv.jks
          SIGNING_KEY_ALIAS: jellyfintv
        run: |
          export KEYSTORE_PASSWORD="$TV_KEYSTORE_PASSWORD" SIGNING_KEY_PASSWORD="$TV_KEYSTORE_PASSWORD"
          set +e
          ./gradlew --no-daemon :app:assembleLibreRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the cause as annotations so it's visible without opening the log
            grep -E "^e: " build.log | head -15 | sed 's/^/::error::/'
            grep -A6 "What went wrong" build.log | head -14 | sed 's/^/::error::/'
          fi
          exit $status

      # Refuse to publish an unsigned build (it couldn't install over the existing app)
      - name: Check APK is signed
        run: |
          ls app/build/outputs/apk/libre/release/
          if ls app/build/outputs/apk/libre/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::APK is unsigned - check the KEYSTORE_PASSWORD secret"
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/libre/release/*.apk out/jellyfin-tv.apk
          # Read by the in-app updater
          echo '{"build": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > out/version.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-tv-apk
          path: out/jellyfin-tv.apk

      # Publish to a fixed "latest" release so the Fire Stick can always download the same URL
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/jellyfin-tv.apk out/version.json \
            --title "Jellyfin TV 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
