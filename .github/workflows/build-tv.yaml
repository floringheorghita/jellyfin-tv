name: Build Jellyfin TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (libre flavour: no Google Play services, works on Fire TV)
        env:
          JELLYFIN_VERSION: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/signing/jellyfin-tv.jks
          KEYSTORE_PASSWORD: jellyfintv
          SIGNING_KEY_ALIAS: jellyfintv
          SIGNING_KEY_PASSWORD: jellyfintv
        run: ./gradlew --no-daemon :app:assembleLibreRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/libre/release/*.apk out/jellyfin-tv.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-tv-apk
          path: out/jellyfin-tv.apk

      # Publish to a fixed "latest" release so the Fire Stick can always download the same URL
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/jellyfin-tv.apk \
            --title "Jellyfin TV 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
